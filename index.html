    <!-- Hero Earth poster: paints before the Three.js chunk loads -->

      rel="preload"
      as="image"
      type="image/webp"
      href="/earth/poster-1600.webp"
      imagesrcset="/earth/poster-800.webp 800w, /earth/poster-1600.webp 1600w"
      imagesizes="(max-width: 720px) 184vw, 1030px"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

    />
