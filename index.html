<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="vercel-toolbar" content="false" />
    <!-- Title, description, canonical, hreflang, Open Graph and JSON-LD
         per language: injected by scripts/prerender.mjs. -->
    <!--app-head-->

    <!-- Hero Earth poster: paints before the Three.js chunk loads -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/earth/poster-1600.webp"
      imagesrcset="/earth/poster-800.webp 800w, /earth/poster-1600.webp 1600w"
      imagesizes="(max-width: 720px) 184vw, 1030px"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
